<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Webhook Sender Pro</title>
    
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #1a1b1e, #0f1012);
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            padding: 20px;
        }

        #webhookUI {
            background: linear-gradient(145deg, #1e1f22, #2b2d31);
            color: #ffffff;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 40px rgba(114,137,218,0.1);
            width: 480px;
            max-width: 100%;
            border: 1px solid rgba(114,137,218,0.2);
            backdrop-filter: blur(10px);
            animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(114,137,218,0.15);
        }

        .bot-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #7289da;
            box-shadow: 0 0 20px rgba(114,137,218,0.3);
            flex-shrink: 0;
            object-fit: cover;
            transition: transform 0.3s ease;
            animation: float 3s ease-in-out infinite;
        }

        .bot-avatar:hover {
            transform: rotate(10deg) scale(1.1);
            animation: none;
        }

        .header-text {
            flex: 1;
        }

        .header-text h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #7289da, #8ea1e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header-text .subtitle {
            margin: 2px 0 0 0;
            font-size: 12px;
            color: #949ba4;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #b5bac1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        label .required {
            color: #ed4245;
            margin-left: 3px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 14px;
            background: #1e1f22;
            border: 2px solid #35373d;
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #7289da;
            box-shadow: 0 0 0 4px rgba(114,137,218,0.15);
            background: #25262b;
        }

        input:hover,
        textarea:hover {
            border-color: #4e5058;
        }

        input::placeholder,
        textarea::placeholder {
            color: #5c5f66;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.6;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .row .input-group {
            margin-bottom: 0;
        }

        .bot-preview {
            margin-top: 6px;
            padding: 8px 12px;
            background: rgba(114,137,218,0.08);
            border-radius: 8px;
            font-size: 12px;
            color: #949ba4;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bot-preview .preview-name {
            color: #7289da;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-family: 'Inter', sans-serif;
        }

        .btn-submit {
            background: linear-gradient(135deg, #7289da, #5b6eae);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(114,137,218,0.3);
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(114,137,218,0.4);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            animation: pulse 1s infinite;
        }

        .btn-clear {
            background: #35373d;
            color: #b5bac1;
            flex: 0.5;
        }

        .btn-clear:hover {
            background: #40434b;
            color: #ffffff;
        }

        .status {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            animation: slideIn 0.2s ease;
        }

        .status.success {
            display: block;
            background: rgba(87, 242, 135, 0.1);
            color: #57f287;
            border: 1px solid rgba(87, 242, 135, 0.2);
        }

        .status.error {
            display: block;
            background: rgba(237, 66, 69, 0.1);
            color: #ed4245;
            border: 1px solid rgba(237, 66, 69, 0.2);
        }

        .status.info {
            display: block;
            background: rgba(114, 137, 218, 0.1);
            color: #7289da;
            border: 1px solid rgba(114, 137, 218, 0.2);
        }

        .status .status-icon {
            margin-right: 8px;
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            font-size: 11px;
            color: #4e5058;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 14px;
        }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            background: rgba(114, 137, 218, 0.2);
            border-radius: 20px;
            font-size: 10px;
            color: #7289da;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        @media (max-width: 520px) {
            #webhookUI {
                padding: 20px;
            }
            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .row .input-group {
                margin-bottom: 16px;
            }
            .row .input-group:last-child {
                margin-bottom: 0;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
            .button-group {
                flex-direction: column;
            }
            .btn-clear {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div id="webhookUI">
        <div class="header">
            <!-- Bot-Avatar mit neuem imgur-Bild -->
            <img class="bot-avatar" src="https://i.imgur.com/4M7IWwP.png" alt="Bot Avatar" onerror="this.src='"https://i.imgur.com/4M7IWwP.png';" />
            <div class="header-text">
                <h2>Discord Webhook</h2>
                <p class="subtitle">Professional Message Sender <span class="badge">v2.0</span></p>
            </div>
        </div>

        <div class="input-group">
            <label>Webhook URL <span class="required">*</span></label>
            <input type="url" id="webhookUrl" placeholder="https://discord.com/api/webhooks/..." />
        </div>

        <div class="input-group">
            <label>Message <span class="required">*</span></label>
            <textarea id="messageContent" placeholder="Type your message here..."></textarea>
        </div>

        <div class="row">
            <div class="input-group">
                <label>Send Count (max 10.000)</label>
                <input type="number" id="sendCount" min="1" max="10000" value="1" />
            </div>
            <div class="input-group">
                <label>Bot Name</label>
                <input type="text" id="botName" placeholder="My Bot" value="Webhook Pro" />
            </div>
        </div>

        <div class="bot-preview">
            <span>Bot will appear as:</span>
            <span class="preview-name" id="botNamePreview">Webhook Pro</span>
        </div>

        <div class="button-group">
            <button class="btn btn-submit" id="submitBtn">Send</button>
            <button class="btn btn-clear" id="clearBtn">Clear</button>
        </div>

        <div class="status" id="statusMessage"></div>

        <div class="footer">
            Max 10.000 messages per batch • <span id="messageCount">0</span> messages sent
        </div>
    </div>

    <script>
        // ============================================================
        // Discord Webhook Sender Pro - Main Script
        // ============================================================
        (function() {
            'use strict';

            // DOM Elements
            const webhookInput = document.getElementById('webhookUrl');
            const messageInput = document.getElementById('messageContent');
            const countInput = document.getElementById('sendCount');
            const botNameInput = document.getElementById('botName');
            const botNamePreview = document.getElementById('botNamePreview');
            const submitBtn = document.getElementById('submitBtn');
            const clearBtn = document.getElementById('clearBtn');
            const statusDiv = document.getElementById('statusMessage');
            const messageCountSpan = document.getElementById('messageCount');

            let totalSent = 0;

            // Bot-Avatar URL (wird für alle Nachrichten verwendet)
            const BOT_AVATAR_URL = 'https://i.imgur.com/4M7IWwP.png';

            // Bot name live preview
            botNameInput.addEventListener('input', function() {
                botNamePreview.textContent = this.value || 'Unnamed Bot';
            });

            // Status message function
            function setStatus(message, type = 'info') {
                const icons = {
                    success: '✓',
                    error: '✗',
                    info: 'i'
                };
                statusDiv.innerHTML = `<span class="status-icon">${icons[type] || 'i'}</span> ${message}`;
                statusDiv.className = 'status ' + type;
                statusDiv.style.display = 'block';
            }

            function clearStatus() {
                statusDiv.className = 'status';
                statusDiv.style.display = 'none';
            }

            // Funktion zum Senden mit automatischem Rate-Limit-Handling
            async function sendWebhookMessageWithRetry(webhookUrl, content, botName, delay = 1000) {
                try {
                    const payload = {
                        content: content,
                        username: botName || 'Webhook Pro',
                        avatar_url: BOT_AVATAR_URL
                    };

                    const response = await fetch(webhookUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 429) {
                        // Rate Limit - warte die empfohlene Zeit
                        const data = await response.json();
                        const retryAfter = (data.retry_after || 1) * 1000;
                        await new Promise(resolve => setTimeout(resolve, retryAfter));
                        // Versuche es erneut (mit erhöhter Verzögerung)
                        return await sendWebhookMessageWithRetry(webhookUrl, content, botName, retryAfter + 100);
                    }

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }

                    return { success: true };
                } catch (error) {
                    if (error.message.includes('429')) {
                        // Falls trotzdem ein 429er kommt, warte und wiederhole
                        await new Promise(resolve => setTimeout(resolve, 2000));
                        return await sendWebhookMessageWithRetry(webhookUrl, content, botName, 2000);
                    }
                    throw error;
                }
            }

            // Hauptfunktion zum Senden mehrerer Nachrichten
            async function sendMultipleMessages(webhookUrl, content, botName, count) {
                const results = [];
                const BATCH_SIZE = 5; // Max 5 Nachrichten pro Sekunde (Discord Limit)
                const DELAY_BETWEEN_BATCHES = 1000; // 1 Sekunde Pause zwischen Batches

                for (let i = 0; i < count; i++) {
                    try {
                        // Alle 5 Nachrichten eine Pause einlegen
                        if (i > 0 && i % BATCH_SIZE === 0) {
                            await new Promise(resolve => setTimeout(resolve, DELAY_BETWEEN_BATCHES));
                        }

                        await sendWebhookMessageWithRetry(webhookUrl, content, botName);
                        results.push({ success: true, index: i + 1 });

                        // Kleine Pause zwischen einzelnen Nachrichten (100ms)
                        if (i < count - 1) {
                            await new Promise(resolve => setTimeout(resolve, 100));
                        }

                    } catch (error) {
                        results.push({ success: false, index: i + 1, error: error.message });
                        // Bei Fehler trotzdem weitermachen
                    }
                }

                return results;
            }

            // Handle submit
            async function handleSubmit() {
                clearStatus();

                const webhookUrl = webhookInput.value.trim();
                const message = messageInput.value.trim();
                const botName = botNameInput.value.trim() || 'Webhook Pro';
                const count = parseInt(countInput.value) || 1;

                // Validation
                if (!webhookUrl) {
                    setStatus('Please enter a Webhook URL!', 'error');
                    webhookInput.focus();
                    return;
                }

                if (!webhookUrl.startsWith('https://discord.com/api/webhooks/')) {
                    setStatus('Invalid Webhook URL! Must start with "https://discord.com/api/webhooks/"', 'error');
                    webhookInput.focus();
                    return;
                }

                if (!message) {
                    setStatus('Please enter a message!', 'error');
                    messageInput.focus();
                    return;
                }

                if (count < 1 || count > 10000) {
                    setStatus('Please enter a number between 1 and 10,000!', 'error');
                    countInput.focus();
                    return;
                }

                // Disable button and show sending status
                submitBtn.disabled = true;
                submitBtn.textContent = 'Sending...';
                setStatus(`Sending ${count} message(s) to Discord... This may take a while.`, 'info');

                try {
                    const startTime = Date.now();
                    const results = await sendMultipleMessages(webhookUrl, message, botName, count);

                    const successful = results.filter(r => r.success).length;
                    const failed = results.filter(r => !r.success).length;
                    const elapsedTime = ((Date.now() - startTime) / 1000).toFixed(1);

                    totalSent += successful;
                    messageCountSpan.textContent = totalSent;

                    if (failed === 0) {
                        setStatus(`✅ Successfully sent ${successful} of ${count} message(s) in ${elapsedTime}s!`, 'success');
                    } else {
                        const errorMsg = results.find(r => !r.success)?.error || 'Unknown error';
                        setStatus(`⚠️ ${successful} succeeded, ${failed} failed. Last error: ${errorMsg}`, 'error');
                    }
                } catch (error) {
                    setStatus(`❌ Error: ${error.message}`, 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send';
                }
            }

            // Event Listeners
            submitBtn.addEventListener('click', handleSubmit);

            // Enter key in message field (Shift+Enter for new line)
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSubmit();
                }
            });

            // Clear button
            clearBtn.addEventListener('click', function() {
                webhookInput.value = '';
                messageInput.value = '';
                countInput.value = '1';
                botNameInput.value = 'Webhook Pro';
                botNamePreview.textContent = 'Webhook Pro';
                clearStatus();
                webhookInput.focus();
            });

            // Auto focus on load
            webhookInput.focus();

            console.log('Discord Webhook Sender Pro loaded successfully!');
            console.log('Bot avatar:', BOT_AVATAR_URL);
            console.log('Supports up to 10,000 messages with automatic rate limiting');
        })();
    </script>
</body>
</html>
